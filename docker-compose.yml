# Stack: MongoDB + API + frontend. Redis, MinIO and a worker are added in the phases that need them.
services:
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: neurobridge
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      MONGO_URL: mongodb://neurobridge:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}  # nginx in the frontend container; 2 when the Caddy TLS proxy is added
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - storage:/srv/storage  # encrypted originals, de-identified copies, processed signals (back this up together with the database)
      - ./backups:/srv/backups  # written by backend/scripts/backup.py via deploy/backup.sh
      - ./ml/models:/ml/models:ro  # trained models; the app resolves ../ml/models from /srv and checks each file's SHA-256 before loading
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mongodata:
  storage:
