# Stack: MongoDB + API + frontend. Redis, MinIO and a worker are added in the phases that need them.
services:
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: neurobridge
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      MONGO_URL: mongodb://neurobridge:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mongodata:
